allowBuilds:
  '@apollo/protobufjs': true
  '@lavamoat/preinstall-always-fail': false
  better-sqlite3: true
  bufferutil: true
  es5-ext: true
  esbuild: true
  keccak: true
  type-graphql: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@originprotocol/squid-utils@1.0.2'

patchedDependencies:
  '@subsquid/portal-client@0.3.2': patches/@subsquid__portal-client@0.3.2.patch
  '@subsquid/typeorm-store@1.9.1': patches/@subsquid__typeorm-store@1.9.1.patch

# Security floors for transitive dependencies flagged by Dependabot. Each selector
# matches only one major and lifts it to the first patched release of that major.
# tar (node-gyp, cacache) is left open on purpose: build-time only, and installs
# run with ignore-scripts=true. uuid 9 (aws-sdk, apollo) is left open: only the
# v3/v5/v6 buffer path is affected, and it is not used.
overrides:
  "@humanfs/node@>=0.0.0 <0.16.8": "^0.16.8"
  "@isaacs/brace-expansion@>=5.0.0 <5.0.1": "^5.0.1"
